[workspace]
members = ["arch", "devices", "ember"]
resolver = "3"

[workspace.package]
version = "0.1.0"
description = "A GPU-first, minimalist Virtual Machine Monitor (VMM)"
authors = ["Anh Pham <honganhpham.works@gmail.com>"]
edition = "2024"

[workspace.dependencies]
arch = { path = "arch" }
anyhow = "1.0.98"
argh = "0.1.19"
ctrlc = "3.5.2"
devices = { path = "devices" }
env_logger = "0.11.11"
kvm-bindings = "0.14.0"
kvm-ioctls = "0.25.0"
linux-loader = { version = "0.14.0", features = ["bzimage"] }
log = "0.4.33"
nix = { version = "0.31.3", features = ["fs", "mman"] }
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
vm-superio = "0.8.1"
vmm-sys-util = "0.15.0"
