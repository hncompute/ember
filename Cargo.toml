[workspace]
members = [
  "acpi_tables",
  "arch",
  "devices",
  "ember",
  "resources",
  "serde_kv_derive",
  "x8664",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
description = "A GPU-first, minimalist Virtual Machine Monitor (VMM)"
authors = ["Anh Pham <honganhpham.works@gmail.com>"]
edition = "2024"

[workspace.dependencies]
arch = { path = "arch" }
devices = { path = "devices" }
acpi_tables = { path = "acpi_tables" }
resources = { path = "resources" }
x8664 = { path = "x8664" }
serde_kv_derive = { path = "serde_kv_derive" }

# External dependencies
anyhow = "1.0.98"
argh = "0.1.19"
ctrlc = "3.5.2"
env_logger = "0.11.11"
kvm-bindings = "0.14.0"
kvm-ioctls = "0.25.0"
linux-loader = { version = "0.14.0", features = ["bzimage"] }
log = "0.4.33"
nix = { version = "0.31.3", features = ["fs", "mman"] }
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
vm-superio = "0.8.1"
vmm-sys-util = "0.15.0"
remain = "0.2"
serde = "1.0"
serde-keyvalue = "0.1.0"
thiserror = "2.0.21"
