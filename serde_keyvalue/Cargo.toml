[package]
name = "serde_keyvalue"
version = "0.1.0"
authors = ["The ChromiumOS Authors"]
edition = "2021"
license = "BSD-3-Clause"
description = "Serde deserializer for comma-separated key=value options, extracted from crosvm"

[features]
argh_derive = ["dep:argh", "dep:serde_keyvalue_derive"]

[dependencies]
argh = { workspace = true, optional = true }
serde_keyvalue_derive = { path = "serde_keyvalue_derive", version = "0.1.0", optional = true }
serde = { workspace = true }
thiserror = "1.0.23"
remain = { workspace = true }
num-traits = "0.2"
nom = { version = "7.1.0", features = ["alloc"] }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
